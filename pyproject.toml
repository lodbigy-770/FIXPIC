[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpic"
version = "0.1.0.dev0"
description = "FIXPIC: הסרת אלמנטים מתמונה (Inpainting מקומי על CPU, ללא רשת)"
requires-python = ">=3.12"          # נבדק על 3.12 (Linux) ו-3.14 (Windows); ADR-002 קובע 3.14
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",                       # fixpic.imgio: טעינה/שמירה, EXIF/ICC
    "onnxruntime>=1.30",            # backend גיבוי (ADR-011)
    "openvino",                     # backend ראשי (ADR-011); בלעדיו המנוע עובד על ORT
]

[project.optional-dependencies]
dev = [
    "pytest",
    "onnx",                         # בונה מודל סינתטי בחוזה של LaMa לבדיקות
]

[project.scripts]
fixpic = "fixpic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
